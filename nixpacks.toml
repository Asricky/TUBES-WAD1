[phases.setup]
nixPkgs = ['nodejs', 'php82', 'php82Extensions.pdo', 'php82Extensions.pdo_mysql', 'php82Extensions.mbstring']

[phases.install]
cmds = ['npm install --include=dev', 'composer install --no-dev --optimize-autoloader']

[phases.build]
cmds = ['npm run build']

[start]
cmd = 'php artisan config:cache && php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=$PORT'
